<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050814"/>
      <stop offset=".45" stop-color="#0b1024"/>
      <stop offset="1" stop-color="#07111a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#94a3b8" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="430" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <ellipse cx="1030" cy="80" rx="210" ry="180" fill="url(#glow)" opacity=".45" filter="url(#blur)"/>
    <ellipse cx="120" cy="390" rx="240" ry="180" fill="#8b5cf6" opacity=".12" filter="url(#blur)"/>

    <g transform="translate(600 520) scale(1 .36)">
      <rect x="-760" y="-700" width="1520" height="700" fill="url(#grid)" opacity=".9"/>
    </g>

    <g opacity=".8">
      <path d="M845 74C1012 85 1092 174 1063 281C1032 397 873 410 760 320C642 227 693 111 845 74Z" fill="none" stroke="url(#accent)" stroke-opacity=".38" stroke-width="1.5"/>
      <path d="M875 97C992 107 1050 169 1030 246C1007 333 899 347 819 284C736 219 773 123 875 97Z" fill="none" stroke="#7dd3fc" stroke-opacity=".24" stroke-width="1"/>
      <circle cx="1063" cy="281" r="5" fill="#34d399">
        <animate attributeName="r" values="4;8;4" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".5;1;.5" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="760" cy="320" r="5" fill="#8b5cf6">
        <animate attributeName="r" values="4;7;4" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="845" cy="74" r="5" fill="#22d3ee">
        <animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(886 213)">
      <circle r="88" fill="none" stroke="#22d3ee" stroke-opacity=".16"/>
      <circle r="60" fill="none" stroke="#8b5cf6" stroke-opacity=".22"/>
      <circle r="30" fill="url(#accent)" opacity=".85" filter="url(#soft)"/>
      <circle r="14" fill="#e2e8f0"/>
      <g>
        <circle cx="88" cy="0" r="5" fill="#34d399"/>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="11s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="0" cy="-60" r="4.5" fill="#22d3ee"/>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="8s" repeatCount="indefinite"/>
      </g>
    </g>

    <g fill="#e5eefb" font-family="Segoe UI,Inter,Arial,sans-serif">
      <text x="84" y="124" font-size="18" font-weight="700" letter-spacing="5" fill="#67e8f9">AI ENGINEER · RESEARCHER · PROBLEM SOLVER</text>
      <text x="78" y="222" font-size="74" font-weight="800" letter-spacing="-2">SANKALP GUPTA</text>
      <rect x="82" y="251" width="540" height="3" rx="2" fill="url(#accent)"/>
      <text x="82" y="302" font-size="23" fill="#aab8cf">Building intelligent systems that solve real-world problems at scale.</text>
      <text x="82" y="344" font-size="15" letter-spacing="2" fill="#6ee7b7">ARTIFICIAL INTELLIGENCE  ·  NLP  ·  BACKEND ENGINEERING  ·  INTELLIGENT AUTOMATION</text>
    </g>

    <g opacity=".5" stroke="#dbeafe" stroke-width="1">
      <path d="M82 70H414"/>
      <path d="M82 362H494"/>
      <path d="M1110 55v88"/>
      <path d="M1088 77h44"/>
    </g>

    <rect width="1200" height="430" rx="28" fill="none" stroke="#334155" stroke-opacity=".7"/>
  </g>
</svg>