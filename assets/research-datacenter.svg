<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050814"/><stop offset=".55" stop-color="#091426"/><stop offset="1" stop-color="#061017"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset=".52" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
  <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#172033"/><stop offset="1" stop-color="#080c14"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#64748b" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1200" height="500" rx="26" fill="url(#bg)"/>
<rect width="1200" height="500" rx="26" fill="url(#grid)"/>

<g font-family="Segoe UI,Arial,sans-serif">
  <text x="55" y="58" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="4">ONGOING RESEARCH · INTELLIGENT INFRASTRUCTURE</text>
  <text x="55" y="103" fill="#f8fafc" font-size="32" font-weight="800">Future AI Datacenters: More Compute, Less Water, Less Energy</text>
  <text x="55" y="132" fill="#94a3b8" font-size="15">A systems view of cooling, renewable support and resource-efficient AI infrastructure.</text>
</g>

<!-- solar field -->
<g transform="translate(65 328)">
  <g fill="#0e1a2a" stroke="#22d3ee" stroke-opacity=".6">
    <path d="M0 45L120 18l50 35-120 28z"/><path d="M145 42l120-27 50 35-120 28z"/><path d="M290 39l120-27 50 35-120 28z"/>
  </g>
  <g stroke="#38bdf8" stroke-opacity=".32"><path d="M28 39l50 35M76 28l50 35M173 36l50 35M221 25l50 35M318 33l50 35M366 22l50 35"/></g>
  <text x="4" y="105" fill="#6ee7b7" font-size="11" font-family="Segoe UI,Arial">RENEWABLE SUPPORT</text>
</g>

<!-- server racks -->
<g transform="translate(555 176)">
  <g>
    <rect x="0" y="0" width="120" height="240" rx="9" fill="url(#rack)" stroke="#475569"/>
    <rect x="145" y="0" width="120" height="240" rx="9" fill="url(#rack)" stroke="#475569"/>
    <rect x="290" y="0" width="120" height="240" rx="9" fill="url(#rack)" stroke="#475569"/>
  </g>
  <g fill="#101827" stroke="#334155">
    <rect x="14" y="20" width="92" height="31" rx="4"/><rect x="14" y="61" width="92" height="31" rx="4"/><rect x="14" y="102" width="92" height="31" rx="4"/><rect x="14" y="143" width="92" height="31" rx="4"/><rect x="14" y="184" width="92" height="31" rx="4"/>
    <rect x="159" y="20" width="92" height="31" rx="4"/><rect x="159" y="61" width="92" height="31" rx="4"/><rect x="159" y="102" width="92" height="31" rx="4"/><rect x="159" y="143" width="92" height="31" rx="4"/><rect x="159" y="184" width="92" height="31" rx="4"/>
    <rect x="304" y="20" width="92" height="31" rx="4"/><rect x="304" y="61" width="92" height="31" rx="4"/><rect x="304" y="102" width="92" height="31" rx="4"/><rect x="304" y="143" width="92" height="31" rx="4"/><rect x="304" y="184" width="92" height="31" rx="4"/>
  </g>
  <g fill="#22d3ee" filter="url(#glow)">
    <circle cx="28" cy="35" r="3"/><circle cx="28" cy="76" r="3"/><circle cx="28" cy="117" r="3"/><circle cx="28" cy="158" r="3"/><circle cx="28" cy="199" r="3"/>
    <circle cx="173" cy="35" r="3"/><circle cx="173" cy="76" r="3"/><circle cx="173" cy="117" r="3"/><circle cx="173" cy="158" r="3"/><circle cx="173" cy="199" r="3"/>
    <circle cx="318" cy="35" r="3"/><circle cx="318" cy="76" r="3"/><circle cx="318" cy="117" r="3"/><circle cx="318" cy="158" r="3"/><circle cx="318" cy="199" r="3"/>
  </g>
</g>

<!-- cooling loop -->
<path d="M530 190C475 190 450 222 450 260v93c0 48 31 74 82 74h458c55 0 85-30 85-78V245c0-42-27-66-72-66" fill="none" stroke="#22d3ee" stroke-opacity=".18" stroke-width="18"/>
<path d="M530 190C475 190 450 222 450 260v93c0 48 31 74 82 74h458c55 0 85-30 85-78V245c0-42-27-66-72-66" fill="none" stroke="url(#cyan)" stroke-width="3" stroke-dasharray="14 12" filter="url(#glow)">
  <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="2.3s" repeatCount="indefinite"/>
</path>

<!-- water / efficiency HUD -->
<g transform="translate(968 188)" font-family="Segoe UI,Arial,sans-serif">
  <circle cx="70" cy="70" r="63" fill="#07111c" stroke="#334155"/>
  <circle cx="70" cy="70" r="48" fill="none" stroke="#22d3ee" stroke-width="6" stroke-dasharray="225 80" transform="rotate(-90 70 70)" filter="url(#glow)"/>
  <text x="70" y="64" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">RESOURCE</text>
  <text x="70" y="88" text-anchor="middle" fill="#67e8f9" font-size="18" font-weight="700">EFFICIENCY</text>
  <text x="70" y="155" text-anchor="middle" fill="#94a3b8" font-size="10" letter-spacing="2">COOLING · POWER · WATER</text>
</g>

<!-- signals -->
<g fill="#34d399" filter="url(#glow)">
  <circle cx="480" cy="190" r="5"><animate attributeName="cx" values="480;530;480" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="1075" cy="340" r="5"><animate attributeName="cy" values="340;265;340" dur="2.8s" repeatCount="indefinite"/></circle>
</g>

<g font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#94a3b8">
  <text x="555" y="445">HIGH-PERFORMANCE GPU INFRASTRUCTURE</text>
  <text x="55" y="470">SMARTER COOLING</text><text x="190" y="470">•</text><text x="210" y="470">LOWER WATER USE</text><text x="355" y="470">•</text><text x="375" y="470">RENEWABLE ENERGY</text>
</g>
<rect width="1200" height="500" rx="26" fill="none" stroke="#334155"/>
</svg>